services:
  #####################################################################
  # Prometheus Volume Permissions Initializer
  #
  #   https://stackoverflow.com/questions/74810089/err-open-prometheus-queries-active-permission-denied
  #
  # This initializer fixes permissions issues that occur when the container is first created. The permission issues will
  # cause the regular Prometheus container to constantly restart.
  prometheusInit:                                                                        
    image: prom/prometheus:latest
    user: root                                                    
    entrypoint:
      - /bin/sh                                                    
      - -c                                                     
      - |     
        chown -R 65534:65534 /prometheus
    volumes:       
      - '~/volumes/prometheus/data:/prometheus'

  #####################################################################
  # Prometheus Data Aggregator
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - '~/volumes/prometheus/data:/prometheus'
      - '~/volumes/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
    ports:
      - '9090:9090'
    depends_on:
      - prometheusInit
    # Only needed if prometheus and node exporter are on the same device...
    networks:
      - 'localprom'

########################################
# Define a local network between Prometheus and Node Exporter on the same bare metal device...
networks:
  localprom:
    driver: 'bridge'
