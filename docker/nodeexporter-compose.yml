services:
  #####################################################################
  # Prometheus Metric Monitor Exporter
  node_exporter:
    container_name: node_exporter
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped
    ports:
      - '9100:9100'
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    # Only needed if prometheus and node exporter are on the same device...
    network:
      - 'localprom'

########################################
# Define a local network between Prometheus and Node Exporter on the same bare metal device...
networks:
  localprom:
    driver: 'bridge'
